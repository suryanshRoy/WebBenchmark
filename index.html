<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBenchmark!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-main">
                <h1>WebBenchmark!</h1>
                <p>Client-Side WASM Hardware Profile</p>
            </div>

            <div class="top-controls">
                <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme">🌙</button>
            </div>
        </header>

        <main class = "dashboard">
            <aside class = "metrics-panel">
                <div class="metric-box">
                    <h3>Status</h3>
                    <span id="status-text" class = "status idle">Ready</span>
                </div>
                <div class="metric-box">
                    <h3>Logical Cores</h3>
                    <span id="core-count">Detecting...</span>
                </div>
                <div class="metrix-box">
                    <h3>Current Speed</h3>
                    <span id="gflops-current">0.00 GFLOPS</span>
                </div>

                <div class="controls">
                    <button id="start-btn" class = "btn primary">Start Stress Test</button>
                    <button id="stop-btn" class="btn secondary" disabled>Stop</button>
                </div>
            </aside>

            <section class="visualizer-panel">
                <div class="visualizer-header">
                    <h2>Live Core HeatMap</h2>
                </div>
                <div class="canvas-container">
                    <canvas id="heatmap-canvas"></canvas>
                    <div id="placeholder-text">Awaiting execution...</div>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="/src/main.js"></script>

</body>
</html>
